name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow docker-publish.yml and release.yml to run this exact suite as a gating
  # `uses:` job before they publish any image or binaries.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Include github.workflow so a direct CI run and the `uses:`-embedded CI job of
  # docker-publish/release land in DISTINCT groups (in a reusable workflow
  # github.workflow resolves to the CALLER), so the caller doesn't cancel in-flight CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install, own-source typecheck, and bun unit tests (shared reusable workflow).
  ci:
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@main

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/function/view
  # docs, tags, categories, per-arg docs, result schemas, and examples. execute:false keeps
  # it deterministic and credential-free — cost_query needs a live app-only azure_graph
  # secret and a network call to Azure Cost Management to scan, so the VGI9xx execution
  # rules are covered separately, not here. fail-on info = strict (zero findings at info or
  # above). The action tag @v2 resolves the latest vgi-lint-check 2.x (haybarn 2.0, vgi.v3).
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "bun run ${{ github.workspace }}/src/worker.ts"
          fail-on: info
          execute: "false"
